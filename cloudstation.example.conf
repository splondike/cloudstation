[general]

provider = "vultr" # Or aws
operating_system = "fedora" # Or ubuntu

[provider.aws]

server_tag = my-tag
instance_type = t3a.large
aws_cli_profile = my-cli-profile
security_group_id = sg-10293098402983 # The network security group to use
image_id = ami-06b1cc1d1e719ec37 # A Fedora 32 image
volume_size_gb = 20 # Root volume size
ssh_key_id = aws-ssh-key-name # The EC2 SSH key you want to use

[provider.vultr]

server_tag = my-tag
api_key = vultr_api_key
# the id of your SSH key in Vultr, use
# curl -H "Authorization: Bearer $VULTR_API_KEY" https://api.vultr.com/v2/ssh-keys
ssh_key_id = ssh_key_id
# Sydney
# curl -H "Authorization: Bearer $VULTR_API_KEY" https://api.vultr.com/v2/regions | jq | less
instance_region = 19
# New Jersey (for Block Storage)
# instance_region = 1
# Fedora 32
# curl -H "Authorization: Bearer $VULTR_API_KEY" https://api.vultr.com/v2/os | jq | less
instance_os = 389
# 1GB instance
# curl -H "Authorization: Bearer $VULTR_API_KEY" https://api.vultr.com/v2/plans | jq | less
instance_type = vc2-1c-1gb
# 8GB instance
# instance_type = vc2-4c-8gb
